[unix_http_server]
file=%(ENV_PHONODEX_RUNTIME_DIR)s/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=%(ENV_PHONODEX_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_PHONODEX_RUNTIME_DIR)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_PHONODEX_RUNTIME_DIR)s/supervisor.sock

[eventlistener:fail-fast]
command=/usr/bin/python3 /opt/phonodex/docker/fail_fast.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=100
priority=0
startsecs=0
autorestart=unexpected
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=2

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_PHONODEX_SCREEN)s -nolisten tcp -ac -noreset
priority=10
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=%(ENV_DBUS_SESSION_BUS_ADDRESS)s
priority=15
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/python3 /opt/phonodex/docker/wait_for_x.py /usr/bin/openbox --config-file /opt/phonodex/docker/openbox.xml
priority=20
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/python3 /opt/phonodex/docker/wait_for_x.py /usr/bin/x11vnc -display :99 -localhost -listen 127.0.0.1 -no6 -rfbport 5900 -forever -shared -nopw -noxdamage -repeat -quiet
priority=30
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=30
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:phonodex]
command=/usr/bin/python3 /opt/phonodex/docker/wait_for_x.py /opt/venv/bin/python /opt/phonodex/main.py
directory=/opt/phonodex
priority=40
startsecs=1
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
